[General]
#################### General ####################

ScreenWidth=""
ScreenHeight=""
# Leave blank to use the actual screen size (recommended).
# Set explicit values only if your greeter reports the wrong resolution.
ScreenPadding=""
# Default 0, Options: from 0 to min(screen width/2,screen height/2).

Font=""
# Leave blank to use the system default font (QGuiApplication::font()), so the
# theme needs no extra font package installed.
# Set a family name only if you want something specific, e.g. Font="Noto Sans"
# or Font="DejaVu Sans". A font that is not installed silently falls back and
# the layout will not be what you designed.
FontSize="13"
# Default is screen height divided by 80 (1080/80=13.5), Options: 0-inf.

KeyboardSize="0.4"
#  Default 0.4, Options 0.1-1.0

RoundCorners="20"

Locale=""
# Locale for data and time format. I suggest leaving it blank.
HourFormat="HH:mm"
# Default Locale.ShortFormat.
DateFormat="dddd d MMMM"
# Default Locale.LongFormat.

HeaderText=""
# You can put something fun.

#################### Background ####################

BackgroundPlaceholder=""
# Must be a relative path.
# Background displayed before the actual background is loaded.
# Use only if the background is a video, otherwise leave blank.
# Connected with: Background.
Background="canvas"
# Must be a relative path, or the special value "canvas" for the animated sky
# drawn in QML (Components/MauveSky.qml) — no image file and no extra dependency.
# Supports: png, jpg, jpeg, webp, gif, avi, mp4, mov, mkv, m4v, webm, canvas.
StarCount="120"
# Only used when Background="canvas". Default 120, Options: 0-500.
# Lower it if the greeter feels slow on old hardware.
BackgroundFps="30"
# Only used when Background="canvas". Default 30, Options: 5-60.
# The canvas is repainted at this rate; 30 keeps the drifting stars and light
# smooth (a full frame costs ~5.8 ms at 1920x1080, so 30 fps is roughly 17% of
# one core on a single thread).
AnimationIntensity="normal"
# Only used when Background="canvas". Default normal, Options: subtle, normal, strong.
# How visible the movement is. "subtle" slows the stars down to barely-there,
# "strong" makes them twinkle fast and breathe more. Changing this needs no
# restart beyond the next greeter load.
BackgroundSpeed=""
# Default 1.0. Options: 0.0-10.0 (can go higher).
# Speed of animated wallpaper.
# Connected with: Background.
PauseBackground=""
# Default false.
# If set to true, stops playback of gifs and freezes Background="canvas" on a
# single frame. Works only with gifs and canvas.
# Connected with: Background.
DimBackground="0.0"
# Options: 0.0-1.0.
# Connected with: DimBackgroundColor
CropBackground="true"
# Default false.
# Crop or fit background.
# Connected with: BackgroundHorizontalAlignment and BackgroundVerticalAlignment doesn't work when set to true.
BackgroundHorizontalAlignment="center"
# Default: center, Options: left, center, right.
# Horizontal position of the background picture.
# Connected with: CropBackground must be set to false.
BackgroundVerticalAlignment="center"
# Horizontal position of the background picture.
# Default: center, Options: bottom, center, top.
# Connected with: CropBackground must be set to false.

